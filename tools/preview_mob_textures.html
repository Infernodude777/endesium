<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Endesium mob textures review</title>
<style>
  body { background: #1a1a22; color: #ddd; font-family: monospace; padding: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; margin-bottom: 24px; }
  .cell { text-align: center; }
  .cell .label { margin-top: 6px; font-size: 12px; color: #9aa; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: repeating-conic-gradient(#2a2a35 0% 25%, #20202a 0% 50%) 0 0/16px 16px; }
  .big canvas { width: 192px; height: 192px; }
  h2 { color: #7ea7a6; font-weight: normal; }
</style>
</head>
<body>
<h1>Endesium mob textures — review sheet</h1>
<div id="sheet"></div>
<script>
const MOBS = ['ash_wraith','chorus_stalker','crystal_burrower','dust_crawler','lumen_moth','marsh_crawler','nullwalker','void_ray'];

function load(name) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, 0, 0);
      resolve(canvas);
    };
    img.src = 'http://127.0.0.1:8899/src/main/resources/assets/endesium/textures/entity/' + name + '.png';
  });
}

async function section(title, names) {
  const h = document.createElement('h2');
  h.textContent = title;
  document.getElementById('sheet').appendChild(h);
  const row = document.createElement('div');
  row.className = 'row';
  for (const name of names) {
    const canvas = await load(name);
    const cell = document.createElement('div');
    cell.className = 'cell big';
    const clone = canvas.cloneNode();
    cell.appendChild(clone);
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = name;
    cell.appendChild(label);
    row.appendChild(cell);
  }
  document.getElementById('sheet').appendChild(row);
}

section('Mob textures', MOBS);
</script>
</body>
</html>
